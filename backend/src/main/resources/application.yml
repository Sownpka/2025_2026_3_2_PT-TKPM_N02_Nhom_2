spring:
  datasource:
    url: jdbc:mysql://localhost:3306/picore?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:picore}
    password: ${DB_PASSWORD:picore123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:toocraft1412@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  servlet:
    context-path: /api

picore:
  jwt:
    secret: ${JWT_SECRET:picore-super-secret-key-2024-change-in-production-min32chars}
    expiration-ms: 86400000
  private-booking:
    deadline-day: SUNDAY
    deadline-time: "23:59"
  notification:
    reminder-hours-before: 2
